<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تيكت كرافت | TicketCraft - منصة حجز التذاكر التفاعلية</title>

    <!-- Readex Pro Arabic & Latin Font Preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Instant FOUC (Flash of Unstyled Content) Prevention Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ticketcraft_lang');
          var lang = (saved === 'en' || saved === 'ar') ? saved : 'ar';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
